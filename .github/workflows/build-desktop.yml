name: Build Desktop Apps

on:
  push:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: digishop-windows
            separator: ";"
          - os: ubuntu-24.04
            artifact_name: digishop-linux
            separator: ":"
          - os: macos-latest
            artifact_name: digishop-macos
            separator: ":"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Ensure assets folder exists
        shell: bash
        run: mkdir -p assets

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libgl1 libgstreamer1.0-0 libmtdev1 xclip xsel

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Windows Kivy dependencies
        if: runner.os == 'Windows'
        run: |
          pip install kivy_deps.sdl2 kivy_deps.glew

      - name: Build executable
        run: |
          pyinstaller --name digishop --onefile --windowed --add-data "assets${{ matrix.separator }}assets" main.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
