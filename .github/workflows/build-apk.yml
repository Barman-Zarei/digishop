name: Build APK

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer app build directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-app-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-app-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            libsqlite3-dev libltdl-dev \
            build-essential ccache patch

      - name: Install Buildozer and Cython
        run: |
          set -euo pipefail
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Show buildozer.spec for debugging
        run: |
          echo "----- buildozer.spec -----"
          cat buildozer.spec
          echo "---------------------------"

      - name: Pre-accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | buildozer android update || true
          ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses --sdk_root="$ANDROID_SDK_ROOT" || true
          fi
        continue-on-error: true

      - name: Build APK
        run: |
          set -euo pipefail
          yes | buildozer -v android debug 2>&1 | tee buildozer_full.log
        env:
          ANDROID_SDK_LICENSE_ACCEPTED: "1"

      - name: Verify APK was actually produced
        run: |
          set -euo pipefail
          if ! ls bin/*.apk 1> /dev/null 2>&1; then
            echo "::error::No APK file found in bin/ — build did not actually succeed."
            exit 1
          fi
          echo "APK found:"
          ls -la bin/*.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digishop-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload full build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-full-log
          path: buildozer_full.log
          if-no-files-found: ignore

      - name: Upload deep buildozer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-deep-logs
          path: .buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore
