name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      VIRTUALENV_PIP: "23.3.2"
      PIP_VERSION: "23.3.2"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Show environment versions
        run: |
          python --version
          python -m pip --version
          java -version
          uname -a

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-v3-${{ runner.os }}-

      - name: Cache Buildozer app build directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-app-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-app-v3-${{ runner.os }}-

      - name: Remove incompatible Buildozer environments
        run: |
          set -euo pipefail

          rm -rf .buildozer
          rm -rf ~/.buildozer

          mkdir -p bin

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev \
            libsqlite3-dev libltdl-dev \
            build-essential ccache patch

      - name: Install Buildozer and Cython
        run: |
          set -euo pipefail

          python -m pip install --upgrade \
            "pip==23.3.2" \
            "setuptools<70" \
            wheel \
            "virtualenv==20.25.1"

          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.36"

          python -m pip --version
          buildozer --version
          cython --version
          virtualenv --version

      - name: Show buildozer.spec for debugging
        run: cat buildozer.spec

      - name: Check required project files
        run: |
          set -euo pipefail

          test -f buildozer.spec
          test -f main.py

          echo "Required project files exist."

      - name: Build APK
        run: |
          set -Eeuo pipefail

          buildozer -v android debug 2>&1 | tee buildozer_full.log

        env:
          ANDROID_SDK_LICENSE_ACCEPTED: "1"

      - name: Verify APK output
        if: success()
        run: |
          set -euo pipefail

          if ! find bin -maxdepth 1 -type f -name "*.apk" | grep -q .; then
            echo "::error::No APK file was generated."
            exit 1
          fi

          echo "Generated APK files:"
          find bin -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: digishop-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-full-log
          path: buildozer_full.log
          if-no-files-found: ignore

      - name: Upload deep buildozer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-deep-logs
          path: |
            .buildozer/android/platform/build-*/build.log
            .buildozer/android/platform/build-*/build/other_builds/*/build.log
          if-no-files-found: ignore
