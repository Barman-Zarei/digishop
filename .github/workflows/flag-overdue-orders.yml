name: Flag Overdue Orders

on:
  schedule:
    - cron: '0 3 * * *'  # Every day at 3:00 AM UTC
  workflow_dispatch:

jobs:
  flag:
    runs-on: ubuntu-24.04
    steps:
      - name: Call backend endpoint
        run: |
          curl -X POST "https://digishop-grwo.onrender.com/api/orders/internal/flag-overdue/" \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_CRON_SECRET }}"
